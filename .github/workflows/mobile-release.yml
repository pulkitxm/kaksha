name: Mobile release

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "core/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --filter @kaksha/core build

      - name: Install app dependencies
        run: cd mobile && bun install --frozen-lockfile

      - name: Raise the app version
        id: version
        run: bun run scripts/bump-version.mjs "${{ inputs.bump || 'patch' }}"

      - name: Build the APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bun run apk:local

      - name: Rename the artifact
        run: mv mobile/build/app-release.apk "mobile/build/kaksha-${{ steps.version.outputs.version }}.apk"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json mobile/package.json
          git commit -m "Release mobile ${{ steps.version.outputs.version }}"
          git tag "mobile-v${{ steps.version.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - uses: actions/upload-artifact@v4
        with:
          name: kaksha-${{ steps.version.outputs.version }}
          path: mobile/build/*.apk
          retention-days: 30

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.version.outputs.version }}
          name: Kaksha ${{ steps.version.outputs.version }}
          body: |
            Android build ${{ steps.version.outputs.version }} (versionCode ${{ steps.version.outputs.code }}).

            Install the APK on a device with unknown sources enabled.
          files: mobile/build/*.apk
          fail_on_unmatched_files: true
