name: Mobile release

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "core/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --filter @kaksha/core build

      - name: Install app dependencies
        run: cd mobile && bun install --frozen-lockfile

      - name: Resolve the version
        id: version
        run: bun run scripts/release-version.mjs

      - name: Build the APK
        run: bun run apk:local

      - name: Name the artifact
        run: mv mobile/build/app-release.apk "mobile/build/${{ steps.version.outputs.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: mobile/build/*.apk
          retention-days: 30

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kaksha ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.code }})
          body: |
            Android build ${{ steps.version.outputs.code }} of version ${{ steps.version.outputs.version }}.

            Built from ${{ github.sha }}.

            Enable installs from unknown sources, then open the APK on the device.
          files: mobile/build/*.apk
          fail_on_unmatched_files: true
          make_latest: true
