name: Mobile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build core
        run: bun run --filter @kaksha/core build
      - name: Install app dependencies
        run: cd mobile && bun install --frozen-lockfile
      - name: Type-check the app
        run: bun run mobile:typecheck
      - name: Bundle for Android
        run: bun run mobile:bundle
