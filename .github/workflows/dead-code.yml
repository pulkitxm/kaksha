name: Dead code

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dead-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build core
        run: npm run build -w @kaksha/core
      - name: Check for unused files, exports and dependencies
        run: npm run dead-code
