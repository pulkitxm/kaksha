name: No code comments

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: no-comments-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check for disallowed code comments
        run: bun run scripts/check-comments.mjs
